name: Portable App Oluş

on:
  push:
    branches: [ "main" ] # Kod main dalına yüklendiğinde çalışır

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        shell: pwsh
        run: |
          pip install pyinstaller
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }

      - name: Tek Dosya (Portable) Exe Oluştur
        shell: pwsh
        run: pyinstaller --onefile --windowed main.py

      - name: Çıktıyı İndirilebilir Yap (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Portable-Uygulama
          path: dist/main.exe
