name: Portable App Oluştur

on:
  push:
    branches: [ "main" ] # Kod main dalına yüklendiğinde çalışır

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        shell: pwsh
        run: |
          pip install pyinstaller
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }

      - name: Portable Paket Oluştur
        shell: pwsh
        run: |
          pyinstaller --onedir --windowed --name "UygulamaAdi" main.py
          Compress-Archive -Path "dist\UygulamaAdi\*" -DestinationPath "dist\UygulamaAdi-Portable.zip" -Force

      - name: Çıktıyı İndirilebilir Yap (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Portable-Uygulama
          path: dist/UygulamaAdi-Portable.zip
